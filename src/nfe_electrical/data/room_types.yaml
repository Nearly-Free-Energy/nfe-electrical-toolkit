# Room vocabulary for the room finder (draft v0.1, built from the pilot drawings' labels).
#
# Labels are matched top to bottom; the first pattern that matches wins, so
# specific names (e.g. "Plumb DUCT", "Kitchen Island") come before general ones.
# `area_m2` is the plausible range used to flag suspicious room outlines.
# `service: true` marks shafts and voids that get no small power by default.

room_types:
  duct:       {pattern: '(?i)\bduct\b|\bplumb\b|\bmech\b|\briser\b', area_m2: [0.05, 6], service: true}
  lift:       {pattern: '(?i)\blift\b|\belevator\b', area_m2: [1, 12], service: true}
  stair:      {pattern: '(?i)\bstair', area_m2: [2, 40], service: true}
  void:       {pattern: '(?i)\bvoid\b', area_m2: [0.5, 200], service: true}
  wc:         {pattern: '(?i)\bwc\b|toilet|\bbath|shower|\bsh\b|ensuite|en-suite|ladies|gents', area_m2: [1.5, 15]}
  bedroom:    {pattern: '(?i)bed\s*room|\bmaster\b', area_m2: [6, 40]}
  kitchen:    {pattern: '(?i)kitchen|kitchenette', area_m2: [4, 50]}
  dining:     {pattern: '(?i)dining', area_m2: [5, 60]}
  lounge:     {pattern: '(?i)lounge|living|sitting|family', area_m2: [8, 80]}
  cinema:     {pattern: '(?i)cinema|media|theat', area_m2: [6, 60]}
  office:     {pattern: '(?i)office|study|business', area_m2: [5, 80]}
  pantry:     {pattern: '(?i)pantry|laundry|utility', area_m2: [1.5, 20]}
  closet:     {pattern: '(?i)walk-?in|closet|wardrobe|\bwic\b|vanity', area_m2: [1, 15]}
  store:      {pattern: '(?i)stor(e|age)', area_m2: [0.5, 40]}
  balcony:    {pattern: '(?i)balcony|terrace|veranda|patio', area_m2: [1, 80]}
  lobby:      {pattern: '(?i)lobby|foyer|entrance|reception|hall\b', area_m2: [2, 120]}
  corridor:   {pattern: '(?i)corridor|landing|passage', area_m2: [2, 150]}
  plant:      {pattern: '(?i)power room|plant|server|generator|tank|switch ?room', area_m2: [2, 200]}
  gym:        {pattern: '(?i)\bgym\b|fitness', area_m2: [10, 200]}
  bar:        {pattern: '(?i)\bbar\b|lounge bar|restaurant|cafe', area_m2: [5, 300]}
  parking:    {pattern: '(?i)parking|driveway|garage', area_m2: [10, 5000], service: true}

# Text that sits on room-label layers but is not a room name (finish tags,
# duct sizes, area tags, levels). A label line directly under another one
# (e.g. "Kitchen" / "Island") is joined to it unless it matches this.
not_room_labels: '(?i)^(cer\.?\s*floor|tiles?\b|floor tiles|below|roof slab|a\s*=|\d|[\d\s.,x×]+(mm2?|m2)?$|ffl|sfl|\+)'

# Labels on these layers are room names. If none sit inside the plotted
# window, the room finder falls back to text on the plotted base copy's own
# layers whose wording matches a room type (PDF imports keep the room names).
label_layers: [Text Room]
