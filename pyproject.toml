[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nfe-electrical-toolkit"
version = "0.1.0"
description = "Open-source toolkit and MCP server for NFE's electrical layouts on architects' DWG floor plans (phase 1 pilot)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Nearly Free Energy"}]
dependencies = [
    "ezdxf>=1.4,<2",
    "shapely>=2.0",
    "mcp>=2.0,<3",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nfe-elec = "nfe_electrical.cli:main"
nfe-elec-mcp = "nfe_electrical.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nfe_electrical = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
